<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domeeni Otsing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
 
    <div class="container">
        <div class="steps">
            <span class="step active">1 OTSI</span>
            <span class="step">2 Kontaktandmed</span>
            <span class="step">3 Maksa</span>
        </div>
 
        <div class="search-section">
            <input type="text" id="domainName" placeholder="Sisesta domeeninimi...">
            <select id="domainExtension">
                <option value=".ee">.ee</option>
                <option value=".com">.com</option>
                <option value=".net">.net</option>
            </select>
            <button class="search-btn" onclick="searchDomain()">Otsi</button>
        </div>
 
        <div id="result" class="hidden">
            <p class="available"><span id="domainResult"></span></p>
            <button class="add-btn" onclick="proceedOrder()">+ Lisa</button>
        </div>
 
        <div id="orderSummary" class="hidden">
            <div class="order-box">
                <h3>Tellimus</h3>
                <p id="orderDetails"></p>
            </div>
            <button class="continue-btn" onclick="goToContactPage()">Jätka</button>
        </div>
    </div>
 
    <script src="script.js"></script>
</body>
</html>
